name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: npm
    env:
      PLAYTHINGS_RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure OIDC-capable npm
        run: npm install --global 'npm@^11.5.1'

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Verify release identity
        run: node tools/playthings/verify-release.mjs --tag "$PLAYTHINGS_RELEASE_TAG"

      - name: Qualify package
        run: npm run check

      - name: Publish to npm through trusted publishing
        run: npm publish --access public
